name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Ruff
        run: |
          python -m ruff check arxivc/client.py arxivc/fetch_service.py arxivc/routers/workflow_actions.py tests

      - name: Frontend syntax check
        run: |
          for f in frontend/*.js; do
            node --check "$f"
          done

  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install format dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt black

      - name: Black check
        run: |
          python -m black --check arxivc/client.py arxivc/fetch_service.py arxivc/routers/workflow_actions.py tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Python compile checks
        run: |
          python -m py_compile arxivc/*.py arxivc/routers/*.py scripts/*.py

      - name: Pytest
        run: |
          python -m pytest -q tests

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install type dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mypy

      - name: Mypy (optional)
        run: |
          python -m mypy --ignore-missing-imports arxivc/client.py arxivc/fetch_service.py arxivc/routers/workflow_actions.py
